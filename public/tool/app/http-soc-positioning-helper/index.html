<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC 随机置位批量工作台</title>
    <script src="../../../theme.js"></script>
    <link rel="stylesheet" href="../../../libs/bootstrap.min.css">
    <link rel="stylesheet" href="../../../theme.css">
    <style>body { background: transparent; padding: 20px; }</style>
</head>
<body>
    <main class="container">
        <section class="card mb-4">
            <div class="card-body text-center position-relative">
                <a href="../../../index.html" class="position-absolute start-0 top-50 translate-middle-y ms-3 text-decoration-none">返回首页</a>
                <a href="./template.xlsx" download="随机置位录入模板.xlsx" class="position-absolute end-0 top-50 translate-middle-y me-3 text-decoration-none">下载随机置位录入模板</a>
                <h1 class="h4 card-title mb-1">SOC 随机置位批量工作台</h1>
                <p class="text-muted mb-0 small">导入航班执行申请表，按当前 SOC 动态航班逐条提交随机置位申请</p>
            </div>
        </section>

        <section class="card mb-4">
            <div class="card-body">
                <h2 class="h5 card-title border-bottom pb-2 mb-3">运行方式</h2>
                <p>下载独立应用，在应用目录安装依赖后运行：</p>
                <pre class="bg-light p-2"><code>pip install -r requirements.txt
python start.py</code></pre>
                <a class="btn btn-outline-secondary" href="./web/index.html">打开工作台页面</a>
            </div>
        </section>

        <section class="card mb-4">
            <div class="card-body">
                <h2 class="h5 card-title border-bottom pb-2 mb-3">下载</h2>
                <a href="../../../exports/http-soc-positioning-helper.zip" download="http-soc-positioning-helper.zip" class="btn btn-primary">下载独立应用</a>
                <a href="./template.xlsx" download="随机置位录入模板.xlsx" class="btn btn-outline-secondary ms-2">下载随机置位录入模板</a>
            </div>
        </section>

        <section class="card">
            <div class="card-body">
                <h2 class="h5 card-title border-bottom pb-2 mb-3">依赖</h2>
                <ul class="mb-0">
                    <li>Python 3.10+</li>
                    <li>requests、beautifulsoup4、openpyxl</li>
                </ul>
            </div>
        </section>
    </main>
    <script type="module" src="./app.js"></script>
</body>
</html>
