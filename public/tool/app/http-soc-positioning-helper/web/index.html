<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOC 随机置位批量工作台</title>
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./libs/bootstrap.min.css"><link rel="stylesheet" href="./theme.css"><link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="shell">
  <header class="topbar"><div><h1>SOC 随机置位批量工作台</h1><p id="statusMessage">等待验证 SOC 凭据</p></div><div class="top-actions"><span id="statusBadge" class="badge text-bg-secondary">待验证</span><button id="themeToggle" class="btn btn-outline-secondary btn-sm" type="button">主题</button></div></header>
  <section class="panel credentials"><div class="heading"><h2>1. 登录凭据</h2><span id="sessionStatus">尚未验证</span></div><label for="credentials" class="form-label">SOC cURL 或 Cookie Header</label><textarea id="credentials" class="form-control mono" rows="4" placeholder="粘贴已登录 SOC 请求的 Copy as cURL 或 Cookie Header" spellcheck="false"></textarea><button id="verifyButton" class="btn btn-primary action" type="button">验证凭据</button><div class="session-grid"><div><small>验证时间</small><strong id="verifiedAt">-</strong></div><div><small>Cookie 字段</small><strong id="cookieCount">0</strong></div><div><small>当前登录人</small><strong id="sessionIdentity">未识别</strong></div></div><div class="keepalive-summary" data-keepalive-widget><div class="keepalive-ring" id="keepAliveRing" hidden><span id="keepAliveCountdown">--</span></div><div class="keepalive-copy"><strong id="keepAliveStatus">保活未启动</strong><span id="keepAliveDetail">验证后启动独立保活检查</span></div></div><div id="savedPanel" hidden><label for="savedCredentials" class="form-label">当前页凭据</label><div class="copy-row"><textarea id="savedCredentials" class="form-control mono" rows="2" readonly></textarea><button id="copyButton" class="btn btn-outline-secondary" type="button">复制</button></div></div></section>
  <section class="panel input-panel"><div class="heading"><h2>2. 导入申请表</h2></div><div class="mode-switch"><input class="btn-check" type="radio" name="inputMode" id="excelMode" value="excel" checked><label class="btn btn-outline-secondary" for="excelMode">Excel</label><input class="btn-check" type="radio" name="inputMode" id="pasteMode" value="paste"><label class="btn btn-outline-secondary" for="pasteMode">粘贴</label></div><div id="excelBox"><label class="form-label" for="excelFile">航班执行申请表</label><input id="excelFile" class="form-control" type="file" accept=".xlsx,.xlsm"></div><div id="pasteBox" hidden><label class="form-label" for="pasteText">粘贴数据（员工号、姓名、日期、出发地、目的地、航班号、申请原因、备注）</label><textarea id="pasteText" class="form-control" rows="6" placeholder="000001&#9;测试员工&#9;2026-01-15&#9;广州&#9;长沙&#9;CZ1234&#9;学习培训&#9;示例备注"></textarea></div><div class="action-row"><button id="checkButton" class="btn btn-outline-secondary" type="button" disabled>数据检查</button><button id="runButton" class="btn btn-success" type="button" disabled>开始录入</button><button id="stopButton" class="btn btn-danger" type="button" disabled>终止</button></div><div id="checkResult" class="check-result">尚未检查</div><ul id="checkErrors" hidden></ul></section>
  <section class="panel status-panel"><div class="heading"><h2>3. 执行状态</h2><span id="progressText">0 / 0</span></div><div class="progress"><div id="progressBar" class="progress-bar" style="width:0%"></div></div><div class="stats"><div><small>总数</small><strong id="total">0</strong></div><div><small>已完成</small><strong id="completed">0</strong></div><div><small>成功</small><strong id="success">0</strong></div><div><small>失败</small><strong id="failed">0</strong></div></div><a id="download" class="btn btn-outline-secondary disabled" aria-disabled="true">下载结果 Excel</a></section>
  <section class="panel results"><div class="heading"><h2>逐条结果</h2><span id="resultCount">0 条</span></div><div class="table-wrap"><table id="resultsTable" hidden><thead><tr><th>来源行</th><th>员工号</th><th>姓名</th><th>航线</th><th>航班号</th><th>申请原因</th><th>状态</th><th>说明</th></tr></thead><tbody></tbody></table><div id="empty">尚无已返回结果</div></div></section>
  <section class="panel logs"><div class="heading"><h2>活动日志</h2></div><ol id="logs"><li>尚无运行记录</li></ol></section>
</main><script type="module" src="./app.mjs"></script>
</body></html>
