<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资质监控（皇帝版）</title>
    <script src="./theme.js"></script>
    <link rel="stylesheet" href="./libs/bootstrap.min.css">
    <link rel="stylesheet" href="./theme.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="workspace-shell">
        <header class="workspace-header">
            <div>
                <h1>资质监控（皇帝版）</h1>
                <p id="statusMessage">等待验证飞行门户 Cookie</p>
            </div>
            <div class="header-actions">
                <span id="statusBadge" class="status-badge is-waiting_credentials">待验证</span>
                <button id="themeToggle" type="button" class="btn btn-outline-secondary btn-sm">主题</button>
            </div>
        </header>

        <main class="workspace-grid">
            <section class="work-panel credential-panel" aria-labelledby="credentialHeading">
                <div class="panel-heading">
                    <h2 id="credentialHeading">登录 Cookie</h2>
                    <span id="sessionStatus">尚未验证</span>
                </div>
                <div class="credential-layout">
                    <div>
                        <label class="form-label" for="credentials">Cookie Header 或 Copy as cURL</label>
                        <textarea id="credentials" class="form-control" rows="4" autocomplete="off" spellcheck="false" placeholder="粘贴已登录 IEB 请求的 Cookie Header 或 Copy as cURL"></textarea>
                    </div>
                    <button id="verifyButton" type="button" class="btn btn-primary">验证并加载分类</button>
                </div>
                <dl class="session-summary">
                    <div><dt>会话</dt><dd id="sessionVerified">未验证</dd></div>
                    <div><dt>验证时间</dt><dd id="sessionVerifiedAt">-</dd></div>
                    <div><dt>分类</dt><dd id="groupCount">0 类</dd></div>
                    <div><dt>子类</dt><dd id="qualificationCount">0 项</dd></div>
                </dl>
            </section>

            <section class="work-panel control-panel" aria-labelledby="controlHeading">
                <div class="panel-heading"><h2 id="controlHeading">批次控制</h2><span>门户原生 Excel</span></div>
                <div class="primary-actions">
                    <button id="exportAllButton" type="button" class="btn btn-success" disabled>一键导出全部</button>
                    <button id="stopButton" type="button" class="btn btn-danger" disabled>停止</button>
                </div>
                <div class="current-item"><span>当前项目</span><strong id="currentItem">-</strong></div>
                <a id="archiveDownload" class="btn btn-outline-secondary disabled" aria-disabled="true">下载完整 ZIP</a>
            </section>

            <section class="work-panel progress-panel" aria-labelledby="progressHeading">
                <div class="panel-heading"><h2 id="progressHeading">运行进度</h2><span id="progressText">0 / 0</span></div>
                <div class="progress" role="progressbar" aria-label="导出进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div id="progressBar" class="progress-bar" style="width: 0%"></div>
                </div>
                <dl class="run-summary">
                    <div><dt>总数</dt><dd id="totalCount">0</dd></div>
                    <div><dt>已完成</dt><dd id="completedCount">0</dd></div>
                    <div><dt>成功</dt><dd id="successCount">0</dd></div>
                    <div><dt>失败</dt><dd id="failedCount">0</dd></div>
                </dl>
            </section>

            <section class="work-panel qualification-panel" aria-labelledby="qualificationHeading">
                <div class="panel-heading"><h2 id="qualificationHeading">按资质查询</h2><span id="loadedCount">尚未加载</span></div>
                <div id="qualificationGroups" class="qualification-groups">
                    <div class="empty-state">验证 Cookie 后加载当前资质分类</div>
                </div>
            </section>

            <section class="work-panel log-panel" aria-labelledby="logHeading">
                <div class="panel-heading"><h2 id="logHeading">活动日志</h2></div>
                <ol id="logList" class="log-list" aria-live="polite"><li class="is-muted">尚无运行记录</li></ol>
            </section>
        </main>
    </div>
    <script type="module" src="./app.mjs"></script>
</body>
</html>
